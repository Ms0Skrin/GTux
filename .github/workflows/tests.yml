# Тесты на каждый push и pull request. Окно (GTK4) здесь не проверяется: его тесты сами
# пропускаются без PyGObject, остальные 100+ тестов не зависят от системы.
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install rich
      - run: python -m unittest discover -s tests -t . -v

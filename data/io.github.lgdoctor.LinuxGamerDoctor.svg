<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29" />
      <stop offset="100%" stop-color="#0f1016" />
    </linearGradient>
    <!-- Неоновый градиент для геймпада и шестеренки -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Подложка в стиле GNOME HIG -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#2a2e45" stroke-width="8" />

  <!-- Внешнее кольцо-шестеренка (символ твикера/настройки) -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-dasharray="45 33.5" stroke-linecap="round" />
    <circle cx="256" cy="256" r="132" fill="none" stroke="#1a1c29" stroke-width="12" />
  </g>

  <!-- Силуэт геймпада в центре -->
  <path d="M175 190 H337 C368 190 392 215 397 246 L408 315 C412 342 391 366 364 366 C345 366 328 354 321 336 L308 302 H204 L191 336 C184 354 167 366 148 366 C121 366 100 342 104 315 L115 246 C120 215 144 190 175 190 Z" fill="#23273a" stroke="url(#neonGrad)" stroke-width="10" stroke-linejoin="round" />

  <!-- Крестовина (D-Pad) -->
  <path d="M168 232 H188 V252 H208 V272 H188 V292 H168 V272 H148 V252 H168 Z" fill="url(#neonGrad)" />

  <!-- Кнопки действий (с ярким акцентом) -->
  <circle cx="340" cy="242" r="12" fill="url(#accentGrad)" />
  <circle cx="314" cy="268" r="12" fill="url(#neonGrad)" />
  <circle cx="366" cy="268" r="12" fill="url(#neonGrad)" />
  <circle cx="340" cy="294" r="12" fill="url(#accentGrad)" />
</svg>
# Ручная база заметок по играм. Ключ — Steam appid.
#
# Правила:
#   - пишем только то, что подтверждено источником (sources);
#   - notes — по языкам: notes.ru и notes.en (тест проверяет, что есть оба);
#   - native = true — у игры есть Linux-версия (по API Steam);
#   - min_max_map_count — игре нужен vm.max_map_count не меньше этого;
#   - online_broken = true — онлайн не работает на Linux из-за античита.
# Статусы античитов для остальных игр берутся из anticheat.json (AreWeAntiCheatYet).

[games.271590]
name = "Grand Theft Auto V Legacy"
online_broken = true
notes.ru = "GTA Online не работает на Linux: с сентября 2024 BattlEye не пускает Proton. Сюжетный режим работает."
notes.en = "GTA Online doesn't work on Linux: since September 2024 BattlEye blocks Proton. Story Mode works."
sources = [
  "https://www.gamingonlinux.com/2024/09/grand-theft-auto-v-gets-battleye-anti-cheat-breaks-online-play-on-steam-deck-linux/",
  "https://areweanticheatyet.com/game/grand-theft-auto-v",
]

